<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#7857ff"><title>Color Pop!</title><style>
:root{--ink:#302b4a;--purple:#7857ff;--pink:#ff5d9e;--panel:rgba(255,255,255,.94)}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:ui-rounded,"Comic Sans MS",system-ui,sans-serif;color:var(--ink);background:linear-gradient(145deg,#fff4c8,#f7dcff 52%,#d8f5ff);overscroll-behavior:none;-webkit-user-select:none;user-select:none}button,input,label{font:inherit}button,label{border:0;cursor:pointer;touch-action:manipulation}.app{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:8px;padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}.bar{background:var(--panel);border:2px solid #fff;border-radius:22px;box-shadow:0 9px 28px rgba(72,49,112,.15);display:flex;align-items:center;gap:7px;padding:8px}.top{overflow-x:auto}.brand{font-weight:1000;font-size:clamp(19px,4vw,29px);white-space:nowrap;margin-right:auto}.brand b{color:var(--pink)}.btn{min-width:45px;height:45px;border-radius:15px;background:#fff;color:var(--ink);box-shadow:0 4px 0 #d9d2eb;font-weight:900;padding:7px 11px;white-space:nowrap}.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #d9d2eb}.btn.active{background:var(--purple);color:#fff;box-shadow:0 4px 0 #4f38b2}.btn.primary{background:var(--pink);color:#fff;box-shadow:0 4px 0 #c53570}.icon{font-size:21px}.stage{min-height:0;position:relative;overflow:hidden;border-radius:24px;background:rgba(255,255,255,.42);box-shadow:inset 0 0 0 2px rgba(255,255,255,.7)}.viewport{position:absolute;inset:0;overflow:hidden;touch-action:none}.paper{position:absolute;left:50%;top:50%;width:min(92vw,1000px);aspect-ratio:4/3;background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 18px 45px rgba(65,45,100,.23);transform-origin:center center;will-change:transform}.paper canvas{display:block;width:100%;height:100%;touch-action:none;background:#fff}.zoom{position:absolute;right:12px;top:12px;z-index:4;background:rgba(48,43,74,.84);color:#fff;border-radius:999px;padding:7px 11px;font-size:13px;font-weight:900}.tip{position:absolute;left:50%;top:12px;z-index:5;transform:translateX(-50%);background:rgba(48,43,74,.86);color:#fff;padding:8px 13px;border-radius:999px;font-size:13px;font-weight:900;pointer-events:none;opacity:0;transition:.2s;white-space:nowrap}.tip.show{opacity:1}.bottom{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center}.tools,.actions{display:flex;gap:7px}.palette{display:flex;gap:7px;overflow-x:auto;padding:3px;scrollbar-width:none}.palette::-webkit-scrollbar{display:none}.swatch{width:39px;height:39px;min-width:39px;border-radius:50%;border:4px solid #fff;box-shadow:0 3px 0 #cfc7e5}.swatch.active{outline:3px solid var(--ink);transform:scale(.9)}.sizebox{display:flex;align-items:center;gap:5px;background:#fff;border-radius:14px;padding:5px 9px;font-weight:900}.sizebox input{width:92px;accent-color:var(--purple)}#upload{display:none}#custom{width:42px;height:42px;border:0;padding:0;background:none}.confetti{position:fixed;z-index:20;pointer-events:none;font-size:24px;animation:pop .9s ease-out forwards}@keyframes pop{to{transform:translate(var(--x),var(--y)) rotate(360deg);opacity:0}}
@media(max-width:720px){.app{gap:6px;padding:max(6px,env(safe-area-inset-top)) 6px max(6px,env(safe-area-inset-bottom))}.bar{border-radius:17px;padding:6px}.brand{font-size:19px}.top .btn .txt{display:none}.top .btn{min-width:43px;padding:6px}.stage{border-radius:18px}.paper{width:94vw;border-radius:14px}.bottom{grid-template-columns:1fr;gap:6px}.tools,.actions{justify-content:center}.palette{order:3;width:100%}.sizebox{flex:1}.actions .btn{flex:1}.bottom .btn{height:43px}}
@media(max-height:560px) and (orientation:landscape){.brand{display:none}.app{grid-template-rows:auto minmax(0,1fr) auto}.bottom{grid-template-columns:auto minmax(180px,1fr) auto}.palette{order:initial}.tools .txt,.actions .txt{display:none}.paper{height:92%;width:auto}}
</style></head><body><main class="app">
<header class="bar top"><div class="brand">🎨 Color <b>Pop!</b></div><button class="btn active" id="brush"><span class="icon">🖌️</span> <span class="txt">Brush</span></button><button class="btn" id="fill"><span class="icon">🪣</span> <span class="txt">Fill</span></button><button class="btn" id="eraser"><span class="icon">🧽</span> <span class="txt">Erase</span></button><button class="btn" id="undo">↩️</button><button class="btn" id="redo">↪️</button></header>
<section class="stage"><div class="viewport" id="viewport"><div class="paper" id="paper"><canvas id="canvas" width="1200" height="900"></canvas></div></div><button class="zoom" id="zoom">100%</button><div class="tip" id="tip">Draw with one finger • pinch with two</div></section>
<footer class="bar bottom"><div class="tools"><label class="btn" for="upload">📷 <span class="txt">Picture</span></label><input id="upload" type="file" accept="image/png,image/jpeg,image/webp"><button class="btn" id="clear">✨ <span class="txt">New</span></button></div><div class="palette" id="palette"></div><div class="actions"><div class="sizebox">● <input id="size" type="range" min="3" max="55" value="15"> ⬤</div><input id="custom" type="color" value="#7857ff" aria-label="Custom color"><button class="btn primary" id="save">💾 <span class="txt">Save</span></button></div></footer>
</main><script>
const $=s=>document.querySelector(s),canvas=$('#canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true}),paper=$('#paper'),viewport=$('#viewport');
const colors=['#ff4d6d','#ff9f1c','#ffd60a','#52b788','#00b4d8','#4361ee','#7b2cbf','#f15bb5','#5b3a29','#111827','#ffffff'];let color=colors[0],tool='brush',drawing=false,last=null,history=[],future=[];
let scale=1,tx=0,ty=0,pointers=new Map(),gesture=null,ignoreTap=false;
function renderView(){paper.style.transform=`translate(calc(-50% + ${tx}px),calc(-50% + ${ty}px)) scale(${scale})`;$('#zoom').textContent=Math.round(scale*100)+'%'}
function resetView(){scale=1;tx=ty=0;renderView();hint('View reset')}
$('#zoom').onclick=resetView;
colors.forEach((c,i)=>{const b=document.createElement('button');b.className='swatch'+(i?'':' active');b.style.background=c;b.onclick=()=>choose(c,b);$('#palette').append(b)});
function choose(c,b){color=c;document.querySelectorAll('.swatch').forEach(x=>x.classList.remove('active'));b?.classList.add('active');if(tool==='eraser')setTool('brush')}
$('#custom').oninput=e=>choose(e.target.value);function setTool(t){tool=t;['brush','fill','eraser'].forEach(id=>$('#'+id).classList.toggle('active',id===t));hint(t==='fill'?'Tap a white area to fill':t==='eraser'?'Rub with one finger':'Draw with one finger')};['brush','fill','eraser'].forEach(id=>$('#'+id).onclick=()=>setTool(id));
function canvasPos(clientX,clientY){const r=canvas.getBoundingClientRect();return{x:(clientX-r.left)*canvas.width/r.width,y:(clientY-r.top)*canvas.height/r.height}}
function snapshot(){history.push(canvas.toDataURL());if(history.length>30)history.shift();future=[]}function restore(src){const im=new Image();im.onload=()=>{ctx.globalCompositeOperation='source-over';ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(im,0,0)};im.src=src}
function strokeSetup(){ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=+$('#size').value;ctx.strokeStyle=color;ctx.fillStyle=color;ctx.globalCompositeOperation=tool==='eraser'?'destination-out':'source-over'}function dot(p){strokeSetup();ctx.beginPath();ctx.arc(p.x,p.y,ctx.lineWidth/2,0,Math.PI*2);ctx.fill()}function line(a,b){strokeSetup();ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}
function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function middle(a,b){return{x:(a.x+b.x)/2,y:(a.y+b.y)/2}}
viewport.addEventListener('pointerdown',e=>{e.preventDefault();viewport.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2){drawing=false;last=null;ignoreTap=true;const [a,b]=[...pointers.values()];gesture={dist:distance(a,b),mid:middle(a,b),scale,tx,ty};hint('Pinch to zoom • drag to move');return}if(pointers.size===1){ignoreTap=false;const p=canvasPos(e.clientX,e.clientY);snapshot();if(tool==='fill'){flood(p.x,p.y,color);burst(e.clientX,e.clientY);return}drawing=true;last=p;dot(p)}});
viewport.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size>=2&&gesture){const [a,b]=[...pointers.values()],m=middle(a,b);scale=Math.max(.65,Math.min(4,gesture.scale*distance(a,b)/gesture.dist));tx=gesture.tx+(m.x-gesture.mid.x);ty=gesture.ty+(m.y-gesture.mid.y);renderView();drawing=false;return}if(drawing&&pointers.size===1){const p=canvasPos(e.clientX,e.clientY);line(last,p);last=p}});
function end(e){pointers.delete(e.pointerId);drawing=false;last=null;if(pointers.size<2)gesture=null}viewport.addEventListener('pointerup',end);viewport.addEventListener('pointercancel',end);
function hex(h){h=h.slice(1);if(h.length===3)h=[...h].map(x=>x+x).join('');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16),255]}
function flood(x,y,h){const sx=Math.floor(x),sy=Math.floor(y),w=canvas.width,hh=canvas.height,img=ctx.getImageData(0,0,w,hh),d=img.data,i=(sy*w+sx)*4,t=[d[i],d[i+1],d[i+2],d[i+3]],f=hex(h),tol=38;if(t.every((v,j)=>Math.abs(v-f[j])<7))return;const st=[[sx,sy]],seen=new Uint8Array(w*hh);while(st.length){const [px,py]=st.pop();if(px<0||py<0||px>=w||py>=hh)continue;const n=py*w+px;if(seen[n])continue;seen[n]=1;const q=n*4;if(Math.abs(d[q]-t[0])>tol||Math.abs(d[q+1]-t[1])>tol||Math.abs(d[q+2]-t[2])>tol||Math.abs(d[q+3]-t[3])>tol)continue;d[q]=f[0];d[q+1]=f[1];d[q+2]=f[2];d[q+3]=255;st.push([px+1,py],[px-1,py],[px,py+1],[px,py-1])}ctx.putImageData(img,0,0)}
$('#undo').onclick=()=>{if(history.length){future.push(canvas.toDataURL());restore(history.pop())}};$('#redo').onclick=()=>{if(future.length){history.push(canvas.toDataURL());restore(future.pop())}};$('#clear').onclick=()=>{snapshot();ctx.globalCompositeOperation='source-over';ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);resetView()};
$('#upload').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{snapshot();ctx.globalCompositeOperation='source-over';ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);const s=Math.min(canvas.width/im.width,canvas.height/im.height),w=im.width*s,h=im.height*s;ctx.drawImage(im,(canvas.width-w)/2,(canvas.height-h)/2,w,h);URL.revokeObjectURL(im.src);resetView();hint('Ready to color!')};im.src=URL.createObjectURL(f)};
$('#save').onclick=()=>{const a=document.createElement('a');a.download='color-pop-art.png';a.href=canvas.toDataURL('image/png');a.click();burst(innerWidth/2,innerHeight/2)};
function hint(t){const el=$('#tip');el.textContent=t;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),1600)}function burst(x,y){['⭐','✨','💖','🌈','🎉'].forEach(s=>{const e=document.createElement('div');e.className='confetti';e.textContent=s;e.style.left=x+'px';e.style.top=y+'px';e.style.setProperty('--x',(Math.random()*180-90)+'px');e.style.setProperty('--y',(-40-Math.random()*130)+'px');document.body.append(e);setTimeout(()=>e.remove(),950)})}
ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);renderView();setTimeout(()=>hint('Draw with one finger • pinch with two'),500);
</script></body></html>
