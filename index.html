</style></head><body><main class="app"><header class="bar top"><div class="brand">🎨 Color <b>Pop!</b></div><button class="btn active" id="brush">🖌️ <span class="txt">Brush</span></button><button class="btn" id="fill">🪣 <span class="txt">Color Drop</span></button><button class="btn" id="eraser">🧽 <span class="txt">Erase</span></button><button class="btn" id="stickers">⭐ <span class="txt">Stickers</span></button><button class="btn" id="undo">↩️</button><button class="btn" id="redo">↪️</button></header><section class="stage"><div class="viewport" id="viewport"><div class="paper" id="paper"><canvas id="canvas" width="1200" height="900"></canvas></div></div><button class="hud zoom" id="zoom">Fit</button><div class="hud status"><span class="dot"></span><span id="saveState">Saved</span></div><div class="tip" id="tip">Upload a picture or start drawing</div><div class="tray" id="tray"></div></section><footer class="bar bottom"><div class="tools"><label class="btn" for="upload">📷 <span class="txt">Picture</span></label><input id="upload" type="file" accept="image/png,image/jpeg,image/webp"><button class="btn" id="clear">✨ <span class="txt">New</span></button></div><div class="palette" id="palette"></div><div class="actions"><div class="sizebox">● <input id="size" type="range" min="3" max="65" value="15"> ⬤</div><input id="custom" type="color" value="#7857ff"><button class="btn primary" id="save">💾 <span class="txt">Save</span></button></div></footer></main><div class="color-drop" id="colorDrop"></div><div class="drop-cursor" id="dropCursor"></div><script>
const $=s=>document.querySelector(s),canvas=$('#canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true}),paper=$('#paper'),viewport=$('#viewport');const colors=['#ff4d6d','#ff9f1c','#ffd60a','#52b788','#00b4d8','#4361ee','#7b2cbf','#f15bb5','#5b3a29','#111827','#ffffff'],stickers=['⭐','🌈','🦄','🦋','🌸','🚀','🐯','❤️'];let color=colors[0],tool='brush',drawing=false,last=null,history=[],future=[],scale=1,tx=0,ty=0,pointers=new Map(),gesture=null,drop=null,artInset=28,saveTimer;
function fitPaper(){const vr=viewport.getBoundingClientRect(),ratio=canvas.width/canvas.height,maxW=Math.max(120,vr.width-28),maxH=Math.max(120,vr.height-28);let w=maxW,h=w/ratio;if(h>maxH){h=maxH;w=h*ratio}paper.style.width=w+'px';paper.style.height=h+'px';scale=1;tx=ty=0;renderView()}function renderView(){paper.style.transform=`translate(calc(-50% + ${tx}px),calc(-50% + ${ty}px)) scale(${scale})`;$('#zoom').textContent=scale===1?'Fit':Math.round(scale*100)+'%'}$('#zoom').onclick=fitPaper;new ResizeObserver(()=>fitPaper()).observe(viewport);
function setCanvasSize(w,h){const max=1600,s=Math.min(1,max/Math.max(w,h));canvas.width=Math.max(320,Math.round(w*s));canvas.height=Math.max(320,Math.round(h*s));fitPaper()}function whiteCanvas(){ctx.globalCompositeOperation='source-over';ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height)}function protectiveBorder(){const b=Math.max(8,Math.round(Math.min(canvas.width,canvas.height)*.012));artInset=b+8;ctx.save();ctx.strokeStyle='#111';ctx.lineWidth=b;ctx.strokeRect(b/2,b/2,canvas.width-b,canvas.height-b);ctx.restore()}
colors.forEach((c,i)=>{const b=document.createElement('button');b.className='swatch'+(i?'':' active');b.style.background=c;b.onpointerdown=e=>startDrag(e,c,b);$('#palette').append(b)});stickers.forEach(s=>{const b=document.createElement('button');b.className='sticker';b.textContent=s;b.onclick=()=>{tool='sticker';selectedSticker=s;$('#tray').classList.remove('show');hint('Tap the picture to place '+s)}});let selectedSticker='⭐';stickers.forEach(s=>{const b=document.createElement('button');b.className='sticker';b.textContent=s;b.onclick=()=>{selectedSticker=s;tool='sticker';$('#tray').classList.remove('show');hint('Tap the picture to place '+s)};$('#tray').append(b)});
function choose(c,b){color=c;document.querySelectorAll('.swatch').forEach(x=>x.classList.remove('active'));b?.classList.add('active');if(tool==='eraser')setTool('brush')}$('#custom').oninput=e=>choose(e.target.value);function setTool(t){tool=t;['brush','fill','eraser'].forEach(id=>$('#'+id).classList.toggle('active',id===t));hint(t==='fill'?'Drag a color onto a closed area':t==='eraser'?'Rub with one finger':'Draw with one finger')}['brush','fill','eraser'].forEach(id=>$('#'+id).onclick=()=>setTool(id));$('#stickers').onclick=()=>$('#tray').classList.toggle('show');
function startDrag(e,c,b){e.preventDefault();choose(c,b);drop={id:e.pointerId,sx:e.clientX,sy:e.clientY,color:c,moved:false};document.addEventListener('pointermove',drag,{passive:false});document.addEventListener('pointerup',dropEnd,{once:true});moveDrop(e.clientX,e.clientY,false)}function drag(e){if(!drop||e.pointerId!==drop.id)return;e.preventDefault();drop.moved||=(Math.hypot(e.clientX-drop.sx,e.clientY-drop.sy)>8);moveDrop(e.clientX,e.clientY,drop.moved)}function moveDrop(x,y,show){const o=$('#colorDrop'),r=$('#dropCursor');o.style.left=x+'px';o.style.top=y+'px';o.style.background=drop?.color||color;r.style.left=x+'px';r.style.top=y+'px';const ok=insideArt(x,y);o.classList.toggle('show',show);r.classList.toggle('show',show&&ok);paper.classList.toggle('drop-ready',show&&ok)}function insideArt(x,y){const r=canvas.getBoundingClientRect(),ix=artInset*r.width/canvas.width,iy=artInset*r.height/canvas.height;return x>=r.left+ix&&x<=r.right-ix&&y>=r.top+iy&&y<=r.bottom-iy}function dropEnd(e){document.removeEventListener('pointermove',drag);if(!drop)return;const d=drop;drop=null;moveDrop(e.clientX,e.clientY,false);if(!d.moved)return hint('Drag the color onto the picture');if(!insideArt(e.clientX,e.clientY))return hint('Drop inside the black border');snapshot();const p=pos(e.clientX,e.clientY);flood(p.x,p.y,d.color);setTool('fill');burst(e.clientX,e.clientY);changed()}
function pos(x,y){const r=canvas.getBoundingClientRect();return{x:(x-r.left)*canvas.width/r.width,y:(y-r.top)*canvas.height/r.height}}function snapshot(){history.push(canvas.toDataURL());if(history.length>30)history.shift();future=[];buttons()}function restore(src){const im=new Image();im.onload=()=>{ctx.globalCompositeOperation='source-over';ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(im,0,0);changed()};im.src=src}function setup(){ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=+$('#size').value;ctx.strokeStyle=color;ctx.fillStyle=color;ctx.globalCompositeOperation=tool==='eraser'?'destination-out':'source-over'}function dot(p){setup();ctx.beginPath();ctx.arc(p.x,p.y,ctx.lineWidth/2,0,Math.PI*2);ctx.fill()}function line(a,b){setup();ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}

function rgb(h){h=h.slice(1);if(h.length===3)h=[...h].map(x=>x+x).join('');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16),255]}function flood(x,y,h){const sx=x|0,sy=y|0,w=canvas.width,hh=canvas.height,img=ctx.getImageData(0,0,w,hh),d=img.data,i=(sy*w+sx)*4,t=[d[i],d[i+1],d[i+2],d[i+3]],f=rgb(h),tol=35;if(t.every((v,j)=>Math.abs(v-f[j])<6))return;const st=[[sx,sy]],seen=new Uint8Array(w*hh);while(st.length){const[px,py]=st.pop();if(px<artInset||py<artInset||px>=w-artInset||py>=hh-artInset)continue;const n=py*w+px;if(seen[n])continue;seen[n]=1;const q=n*4;if(Math.abs(d[q]-t[0])>tol||Math.abs(d[q+1]-t[1])>tol||Math.abs(d[q+2]-t[2])>tol||Math.abs(d[q+3]-t[3])>tol)continue;d[q]=f[0];d[q+1]=f[1];d[q+2]=f[2];d[q+3]=255;st.push([px+1,py],[px-1,py],[px,py+1],[px,py-1])}ctx.putImageData(img,0,0)}
$('#upload').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{snapshot();setCanvasSize(im.naturalWidth,im.naturalHeight);whiteCanvas();const pad=Math.max(24,Math.round(Math.min(canvas.width,canvas.height)*.04)),aw=canvas.width-pad*2,ah=canvas.height-pad*2,s=Math.min(aw/im.width,ah/im.height),w=im.width*s,h=im.height*s;ctx.drawImage(im,(canvas.width-w)/2,(canvas.height-h)/2,w,h);protectiveBorder();fitPaper();history=[];future=[];buttons();changed();hint('Ready to color!')};im.src=URL.createObjectURL(f)};$('#clear').onclick=()=>{snapshot();setCanvasSize(1200,900);whiteCanvas();protectiveBorder();fitPaper();changed();hint('Fresh canvas!')};$('#undo').onclick=()=>{if(history.length){future.push(canvas.toDataURL());restore(history.pop());buttons()}};$('#redo').onclick=()=>{if(future.length){history.push(canvas.toDataURL());restore(future.pop());buttons()}};function buttons(){$('#undo').disabled=!history.length;$('#redo').disabled=!future.length}$('#save').onclick=()=>{const a=document.createElement('a');a.download='color-pop-art.png';a.href=canvas.toDataURL('image/png');a.click();burst(innerWidth/2,innerHeight/2)};
function changed(){$('#saveState').textContent='Saving…';clearTimeout(saveTimer);saveTimer=setTimeout(()=>{try{localStorage.setItem('colorpop-drawing',canvas.toDataURL('image/jpeg',.86));localStorage.setItem('colorpop-size',canvas.width+','+canvas.height);$('#saveState').textContent='Saved'}catch{$('#saveState').textContent='Save full'}},500)}function loadAutosave(){const src=localStorage.getItem('colorpop-drawing'),size=localStorage.getItem('colorpop-size');if(!src||!size)return false;const[w,h]=size.split(',').map(Number),im=new Image();im.onload=()=>{setCanvasSize(w,h);ctx.drawImage(im,0,0);fitPaper();hint('Your last drawing was restored')};im.src=src;return true}

if(!loadAutosave()){whiteCanvas();protectiveBorder();fitPaper()}buttons();setTimeout(()=>hint('Draw, add stickers, or drag a color to fill'),500);if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
